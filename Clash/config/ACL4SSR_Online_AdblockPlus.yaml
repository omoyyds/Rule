# ACL4SSR_Online_AdblockPlus.yaml
# Clash Meta / Clash Party compatible override
# Converted from user supplied ini

proxy-groups:

  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚁 自建节点
      - 🔯 故障转移
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🚁 自建节点
    type: select
    include-all: true
    filter: "(IEPL|自建|Node|🔯 故障转移|0.20x)"

  - name: 🔯 故障转移
    type: fallback
    include-all: true
    filter: "(IEPL|自建|Node|0.20x)"
    url: http://www.gstatic.com/generate_204
    interval: 300

