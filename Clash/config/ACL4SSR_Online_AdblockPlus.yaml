proxy-groups:

  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚁 自建节点
      - 🔯 故障转移
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true

  - name: 🚁 自建节点
    type: select
    filter: "(IEPL|自建|Node|🔯 故障转移|0.20x)"

  - name: 🔯 故障转移
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(IEPL|自建|Node|0.20x)"

