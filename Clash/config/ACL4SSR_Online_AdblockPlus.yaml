# ACL4SSR Online AdblockPlus - Clash Party / Mihomo YAML override
# Converted from ACL4SSR_Online_AdblockPlus.ini.
# Apply this as a YAML merge override on top of a subscription containing proxies.

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    include-all: true
    exclude-type: direct
    proxies:
      - "♻️ 自动选择"
      - "🚁 自建节点"
      - "🔯 故障转移"
      - DIRECT

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    exclude-type: direct
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🚁 自建节点"
    type: select
    include-all: true
    exclude-type: direct
    filter: "(IEPL|自建|Node|0.20x)"
    proxies:
      - "🔯 故障转移"

  - name: "🔯 故障转移"
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(IEPL|自建|Node|0.20x)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🌍 国外媒体"
