rule-providers:

  CustomDirectConnection:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/omoyyds/Rule/main/Clash/rule/CustomDirectConnection.list
    path: ./rules/CustomDirectConnection.yaml
    interval: 86400

  BanAD:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
    path: ./rules/BanAD.yaml
    interval: 86400

  OpenAI:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/omoyyds/Rule/refs/heads/main/Clash/rule/OpenAI.list
    path: ./rules/OpenAI.yaml
    interval: 86400

  Gemini:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Gemini/Gemini.list
    path: ./rules/Gemini.yaml
